[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "A team of Claude agents that plans, runs and reviews a data analysis on any CSV"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshith Konatham" }]
dependencies = [
    "anthropic>=0.80",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
]

[project.scripts]
analyst = "agentic_analyst.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentic_analyst"]

[tool.coverage.report]
fail_under = 85
show_missing = true
